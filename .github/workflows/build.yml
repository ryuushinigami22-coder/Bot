name: Android APK Builder - Per User GitHub Folder

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Project folder inside builds/<user>/<tag>/project"
        required: true
        type: string
      source_ref:
        description: "Per-build source branch containing the uploaded project"
        required: true
        type: string
      tag:
        description: "Unique build tag"
        required: true
        type: string
      build_type:
        description: "debug or release"
        required: false
        default: release
        type: choice
        options: [release, debug]
      project_type:
        description: "flutter, native or auto"
        required: false
        default: auto
        type: choice
        options: [auto, flutter, native]
      user_id:
        description: "Telegram user ID"
        required: false
        default: unknown
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout user build folder
        uses: actions/checkout@v4
        with:
          # Workflow is dispatched from main/default branch so GitHub can
          # resolve workflow_dispatch. The actual project lives on the
          # isolated per-build source branch.
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Prepare per-user workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build-output build-logs
          mkdir -p build-output build-logs
          PROJECT_DIR="${{ inputs.project_path }}"
          test -d "$PROJECT_DIR" || { echo "::error::Folder project tidak ditemukan: $PROJECT_DIR"; exit 1; }
          if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
            PROJECT_TYPE=flutter
          elif [ -f "$PROJECT_DIR/gradlew" ] || find "$PROJECT_DIR" -maxdepth 2 -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print -quit | grep -q .; then
            PROJECT_TYPE=native
          else
            PUBSPEC=$(find "$PROJECT_DIR" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit || true)
            GRADLEW=$(find "$PROJECT_DIR" -type f -name gradlew -not -path '*/.gradle/*' -print -quit || true)
            if [ -n "$PUBSPEC" ]; then PROJECT_TYPE=flutter; PROJECT_DIR=$(dirname "$PUBSPEC"); elif [ -n "$GRADLEW" ]; then PROJECT_TYPE=native; PROJECT_DIR=$(dirname "$GRADLEW"); else echo "::error::Project Flutter/Native tidak ditemukan."; exit 1; fi
          fi
          if [ "${{ inputs.project_type }}" = flutter ]; then PROJECT_TYPE=flutter; fi
          if [ "${{ inputs.project_type }}" = native ]; then PROJECT_TYPE=native; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          { echo "PROJECT_TYPE=$PROJECT_TYPE"; echo "PROJECT_DIR=$PROJECT_DIR"; echo "USER_ID=${{ inputs.user_id }}"; echo "BRANCH=$GITHUB_REF_NAME"; } | tee build-logs/project-analysis.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Prepare Flutter Android host
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f gradlew ] && [ ! -f android/gradlew ]; then flutter create --platforms=android --no-pub .; fi

      - name: Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/flutter-pub-get.log"

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --${{ inputs.build_type }} -v 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/flutter-build.log"

      - name: Build Native Android APK
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build-logs/native-build.log"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE_BIN=./gradlew
          else
            echo "Gradle wrapper lengkap tidak tersedia; menggunakan Gradle 8.4." | tee "$LOG"
            curl -fL --retry 4 --retry-all-errors -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
            GRADLE_BIN="$RUNNER_TEMP/gradle/gradle-8.4/bin/gradle"
          fi
          if [ "${{ inputs.build_type }}" = debug ]; then "$GRADLE_BIN" --no-daemon --stacktrace assembleDebug 2>&1 | tee "$LOG"; else "$GRADLE_BIN" --no-daemon --stacktrace assembleRelease 2>&1 | tee "$LOG"; fi

      - name: Collect APK and diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp -f {} build-output/ \; 2>/dev/null || true
          { echo "===== PROJECT ====="; cat build-logs/project-analysis.txt 2>/dev/null || true; echo; echo "===== JAVA ====="; java -version 2>&1 || true; echo; echo "===== APK ====="; find build-output -maxdepth 1 -type f -exec ls -lh {} \; 2>/dev/null || true; echo; echo "===== BUILD LOG TAIL ====="; for f in build-logs/*build.log; do [ -f "$f" ] || continue; echo "----- $f -----"; tail -n 400 "$f"; done; } > build-logs/final-diagnostic.txt 2>&1

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK=$(find build-output -maxdepth 1 -type f -name '*.apk' -print -quit)
          [ -n "$APK" ] || { echo "::error::APK tidak ditemukan."; exit 1; }
          echo "APK=$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ inputs.tag }}
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ inputs.tag }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup runner build files
        if: always()
        run: rm -rf build-output build-logs
