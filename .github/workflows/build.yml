name: Build Android APK - Auto Flutter + Native

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Release asset URL for the uploaded project ZIP"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_type:
        description: "debug or release"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      PUB_CACHE: "${{ github.workspace }}/.pub-cache"

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download project ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf project_raw project.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          test -s project.zip
          unzip -t project.zip >/dev/null
          unzip -q project.zip -d project_raw
          echo "ZIP_SIZE=$(du -h project.zip | cut -f1)"

      - name: Detect project type and root
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(pwd)/project_raw"

          # Handle ZIPs that contain one top-level project directory.
          mapfile -t dirs < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t files < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type f -print)
          if [ "${#dirs[@]}" -eq 1 ] && [ "${#files[@]}" -eq 0 ]; then
            ROOT="${dirs[0]}"
          fi

          FLUTTER="false"
          NATIVE="false"
          if [ -f "$ROOT/pubspec.yaml" ]; then
            FLUTTER="true"
          elif [ -f "$ROOT/gradlew" ] || [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/build.gradle" ] || [ -f "$ROOT/build.gradle.kts" ]; then
            NATIVE="true"
          fi

          if [ "$FLUTTER" = "false" ] && [ "$NATIVE" = "false" ]; then
            echo "ERROR: ZIP bukan project Flutter/Android yang dikenali."
            find "$ROOT" -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "flutter=$FLUTTER" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "=== PROJECT DETECTION ==="
          echo "ROOT=$ROOT"
          echo "FLUTTER=$FLUTTER"
          echo "NATIVE=$NATIVE"

      - name: Setup Flutter from project version when available
        if: steps.detect.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ${{ steps.detect.outputs.project_dir }}/pubspec.yaml
          cache: true

      - name: Setup Flutter stable fallback
        if: steps.detect.outputs.flutter == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter --version

      - name: Flutter dependencies
        if: steps.detect.outputs.flutter == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.flutter == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TYPE="${{ github.event.inputs.build_type }}"
          LOG="$GITHUB_WORKSPACE/flutter-build.log"
          set +e
          flutter build apk --$TYPE -v 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          # Only migrate when Flutter explicitly reports an unsupported/legacy
          # Android host. Never migrate a normal Gradle/Dart/Kotlin failure.
          if [ "$RC" -ne 0 ] && grep -qiE 'unsupported Gradle project|Your app is using an unsupported Gradle project|legacy Android host' "$LOG"; then
            echo "=== LEGACY FLUTTER HOST DETECTED: SAFE MIGRATION ==="
            cp -a android "android.backup.before-migration" 2>/dev/null || true
            flutter create --platforms=android --no-pub .
            flutter pub get
            flutter build apk --$TYPE -v 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
          fi

          exit "$RC"

      - name: Build Native Android APK
        if: steps.detect.outputs.native == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/native-build.log"
            else
              ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/native-build.log"
            fi
          else
            echo "ERROR: Native project tidak memiliki gradlew."
            echo "Gunakan Gradle wrapper di project agar versi Gradle/AGP tetap mengikuti project."
            exit 1
          fi

      - name: Find APK outputs
        id: output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find "$GITHUB_WORKSPACE/project_raw" -type f -name '*.apk' -print | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
            echo "APK tidak ditemukan."
            exit 0
          fi
          echo "apk_found=true" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: steps.output.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.tag }}
          path: ${{ steps.output.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload full build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.event.inputs.tag }}
          path: |
            ${{ github.workspace }}/*-build.log
            ${{ github.workspace }}/project_raw/**/build/reports/**
            ${{ github.workspace }}/project_raw/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail if APK was not produced
        if: steps.output.outputs.apk_found != 'true'
        shell: bash
        run: |
          echo "BUILD FAILED: kompilasi selesai tetapi APK tidak ditemukan."
          exit 1
