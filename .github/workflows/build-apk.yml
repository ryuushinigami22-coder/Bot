name: build-apk

on:
  push:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        run: |
          set -e
          flutter pub get
          flutter build apk --release --verbose

      - name: Collect APK
        if: success()
        run: |
          mkdir -p output
          find . -type f -name '*.apk' -not -path './.git/*' -exec cp {} output/ \;
          test -n "$(find output -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: output/*.apk
          if-no-files-found: error
