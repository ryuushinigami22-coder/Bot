name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android/Kotlin/Java"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download ZIP
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ github.event.inputs.zip_url }}'
          test -n "$URL"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors             -H "Authorization: Bearer ${{ github.token }}"             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "$URL" -o project.zip
          test -s project.zip
          unzip -t project.zip >/dev/null

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project_raw
          unzip -q project.zip -d project_raw
          SUB_DIR_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -n 1)
          else
            PROJECT_DIR=project_raw
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "GRADLE_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          elif [ -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "GRADLE_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Kotlin/Java Android
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FOUND=$(find "$GITHUB_WORKSPACE/$PROJECT_DIR" -type f -name '*.apk' | head -n 1 || true)
          test -n "$APK_FOUND" || { echo "ERROR: APK tidak ditemukan."; exit 1; }
          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error